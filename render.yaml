# Blueprint do Render: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: transmissao-tela
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    autoDeploy: false # o deploy vem do GitHub Actions, depois do CI passar
    envVars:
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: TURN_URL
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false
